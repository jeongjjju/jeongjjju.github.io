title: Jeongju Park
longtitle: Jeongju Park — HCI Researcher & Maker
author: Jeongju Park
email: jeongjupark@gm.gist.ac.kr
description: >-
  Portfolio of Jeongju Park, an HCI researcher working on haptics,
  virtual reality, and interactive systems.

url: "https://jeongjjju.github.io"
baseurl: ""

remote_theme: sighingnow/jekyll-gitbook

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge

toc:
  enabled: false
  enabled_index: false
  h_min: 2
  h_max: 3

collections:
  pages:
    output: true
    sort_by: order
    permalink: /:collection/:path/
  portfolio:
    output: true
    sort_by: order
    permalink: /projects/:path/

ordered_collections: []

page_width: 860px
syntax_highlighter_style: colorful

extra_css:
  - assets/css/portfolio.css

extra_footer_js:
  - assets/js/theme-toggle.js

plugins:
  - jekyll-feed
  - jekyll-readme-index
  - jekyll-redirect-from
  - jekyll-remote-theme
  - jemoji

exclude:
  - README.md
  - LICENSE.txt
  - screenshot.PNG
  - jekyll-agency.gemspec
  - Upcoming
  - vendor
